# fallback lock screen. only used if the kajukatli shell is not running.
# the real one lives in ~/.config/quickshell/kajukatli/modules/lock
# colours come from the wallpaper (kk-theme writes the file sourced below)
$kk_bg = rgba(0c0c0cff)
$kk_fg = rgba(e8e4dcff)
$kk_dim = rgba(a39e94ff)
$kk_accent = rgba(c9b79cff)
$kk_error = rgba(b5655aff)
source = ~/.cache/kajukatli/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.cache/kajukatli/current/display.jpg
    color = $kk_bg
    blur_passes = 0
    brightness = 0.45
    contrast = 0.9
    vibrancy = 0
    vibrancy_darkness = 0
}

label {
    monitor =
    text = cmd[update:30000] date +"%H:%M"
    color = $kk_fg
    font_size = 120
    font_family = Syne
    position = 72, 120
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:60000] date +"%A · %-d %B"
    color = $kk_dim
    font_size = 13
    font_family = DM Mono
    position = 78, 90
    halign = left
    valign = bottom
}

input-field {
    monitor =
    size = 280, 36
    outline_thickness = 0
    inner_color = rgba(ffffff14)
    outer_color = rgba(00000000)
    font_color = $kk_fg
    check_color = $kk_accent
    fail_color = $kk_error
    fade_on_empty = false
    placeholder_text = password
    fail_text = not quite
    dots_size = 0.18
    dots_spacing = 0.6
    dots_center = false
    rounding = -1
    position = 78, 40
    halign = left
    valign = bottom
}
