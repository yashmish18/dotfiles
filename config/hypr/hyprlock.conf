# fallback lock screen. only used if the kajukatli shell is not running.
# the real one lives in ~/.config/quickshell/kajukatli/modules/lock

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.cache/kajukatli/current/display.jpg
    color = rgba(0c0c0cff)
    blur_passes = 0
    brightness = 0.45
    contrast = 0.9
    vibrancy = 0
    vibrancy_darkness = 0
}

label {
    monitor =
    text = cmd[update:30000] date +"%H:%M"
    color = rgba(e8e4dcff)
    font_size = 120
    font_family = IBM Plex Serif Light Italic
    position = 72, 120
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:60000] date +"%A · %-d %B" | tr '[:upper:]' '[:lower:]'
    color = rgba(a39e94ff)
    font_size = 13
    font_family = IBM Plex Mono
    position = 78, 90
    halign = left
    valign = bottom
}

input-field {
    monitor =
    size = 280, 36
    outline_thickness = 0
    inner_color = rgba(00000000)
    outer_color = rgba(00000000)
    font_color = rgba(e8e4dcff)
    check_color = rgba(c9b79cff)
    fail_color = rgba(b5655aff)
    fade_on_empty = false
    placeholder_text = <i>say the word</i>
    fail_text = <i>not quite.</i>
    dots_size = 0.18
    dots_spacing = 0.6
    dots_center = false
    rounding = 0
    position = 78, 40
    halign = left
    valign = bottom
}
