# kajukatli · kitty
# colours live in colors.conf (written by kk-theme from the wallpaper)

# --- type ------------------------------------------------------------
font_family      family="DM Mono"
bold_font        family="DM Mono" style="Medium"
# no slanted letters anywhere: "italic" text is drawn upright
italic_font      family="DM Mono" style="Regular"
bold_italic_font family="DM Mono" style="Medium"
# icons in prompts and tools come from the nerd font symbols
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD Symbols Nerd Font
font_size        11.5
modify_font      cell_height 112%
disable_ligatures cursor

# --- the cursor has a little tail -----------------------------------
cursor_shape          beam
cursor_beam_thickness 1.6
cursor_blink_interval 0.6
cursor_stop_blinking_after 12
cursor_trail          3
cursor_trail_decay    0.08 0.32
cursor_trail_start_threshold 3

# --- room to breathe ---------------------------------------------------
window_padding_width  14 18
placement_strategy    center
hide_window_decorations yes
confirm_os_window_close 0
# glass: translucent, and hyprland blurs what shows through (off on battery with the rest)
background_opacity    0.80
dynamic_background_opacity yes

# --- tabs read like film frames: 01 ~/code  02 htop -----------------------
tab_bar_edge          bottom
tab_bar_style         separator
tab_separator         "  "
tab_bar_margin_width  12
tab_bar_margin_height 6 4
tab_title_template    " {fmt.fg._5a5650}{index:02d}{fmt.fg.tab} {title.lower()} "
active_tab_title_template " {index:02d} {title.lower()} "
active_tab_font_style bold
inactive_tab_font_style normal

# --- behaviour -----------------------------------------------------------
scrollback_lines      8000
copy_on_select        clipboard
strip_trailing_spaces smart
enable_audio_bell     no
visual_bell_duration  0.12
visual_bell_color     #2a2622
window_alert_on_bell  yes
url_style             curly
detect_urls           yes
mouse_hide_wait       2.0
input_delay           2
repaint_delay         8
sync_to_monitor       yes
allow_remote_control  socket-only
listen_on             unix:@kitty-{kitty_pid}
shell_integration     enabled
update_check_interval 0
wayland_titlebar_color background

# --- keys ------------------------------------------------------------------
map ctrl+shift+enter  new_window_with_cwd
map ctrl+shift+t      new_tab_with_cwd
map ctrl+shift+e      open_url_with_hints
map ctrl+shift+p>f    kitten hints --type path --program -
map ctrl+equal        change_font_size all +1.0
map ctrl+minus        change_font_size all -1.0
map ctrl+0            change_font_size all 0
map ctrl+shift+a>m    set_background_opacity +0.05
map ctrl+shift+a>l    set_background_opacity -0.05
map ctrl+shift+f5     load_config_file

include colors.conf
