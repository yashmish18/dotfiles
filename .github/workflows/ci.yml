name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck install.sh uninstall.sh bin/kk-* scripts/*.sh
      - run: ./scripts/validate-package-manifests.sh
      - run: bash -n install.sh uninstall.sh
  arch-smoke:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - run: pacman -Syu --noconfirm sudo git python
      - run: bash -n install.sh uninstall.sh
      - run: ./install.sh --dry-run --yes
