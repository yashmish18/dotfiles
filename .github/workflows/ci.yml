name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      # errors only: style warnings shouldn't turn every push red
      - run: shellcheck -S error -s bash install.sh uninstall.sh scripts/*.sh $(grep -l '^#!.*\(ba\)\?sh' bin/kk-*)
      - run: ./scripts/validate-package-manifests.sh
      - run: bash -n install.sh uninstall.sh
  arch-smoke:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - run: pacman -Syu --noconfirm sudo git python
      - run: bash -n install.sh uninstall.sh
      - run: ./install.sh --dry-run --yes
