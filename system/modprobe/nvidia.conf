# kajukatli · nvidia on a hybrid laptop
# modeset: required for wayland. fbdev: proper framebuffer console.
options nvidia_drm modeset=1 fbdev=1
# 0x02 = fine-grained runtime power management: the dgpu sleeps when idle
# PreserveVideoMemoryAllocations: survive suspend without corrupted windows
options nvidia NVreg_DynamicPowerManagement=0x02 NVreg_PreserveVideoMemoryAllocations=1
